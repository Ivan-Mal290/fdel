# Run from the repository root; relative paths resolve against the -p prefix:
#   nginx -p "$PWD/" -c "$PWD/deploy/nginx/nginx.conf"

worker_processes 1;
pid tmp/nginx/nginx.pid;
error_log tmp/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        font/woff2 woff2;
    }
    default_type application/octet-stream;

    access_log tmp/nginx/access.log;
    client_body_temp_path tmp/nginx/client_body;
    proxy_temp_path tmp/nginx/proxy;
    fastcgi_temp_path tmp/nginx/fastcgi;
    uwsgi_temp_path tmp/nginx/uwsgi;
    scgi_temp_path tmp/nginx/scgi;

    sendfile on;
    server_tokens off;

    upstream fdel_api {
        server 127.0.0.1:8000;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root frontend/dist;
        index index.html;

        # Must stay above MAX_FILE_SIZE (100 MB) plus multipart overhead.
        client_max_body_size 101m;

        # Overwrite instead of appending, so clients cannot spoof the IP used by the rate limit.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://fdel_api/;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /d/ {
            proxy_pass http://fdel_api;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
